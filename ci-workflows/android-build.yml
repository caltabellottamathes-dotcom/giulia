name: Build Android App (Capacitor)

# Zero-touch cloud build — no local Android Studio required.
# Run manually from the GitHub "Actions" tab ("Run workflow"), or it runs
# automatically whenever src/ or capacitor.config.ts changes on main.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI + Android platform packages
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android @capacitor/haptics @capacitor/push-notifications

      - name: Add Android native platform
        run: npx cap add android

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Allow gradlew execution
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: giulia-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
