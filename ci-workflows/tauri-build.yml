name: Build Windows App (Tauri)

# Zero-touch cloud build — no local Rust/Xcode required.
# Run manually from the GitHub "Actions" tab ("Run workflow"), or it runs
# automatically whenever src-tauri/ or src/ changes on main.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "public/**"
      - ".github/workflows/tauri-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icon set from SVG source
        run: npx --yes @tauri-apps/cli icon public/icons/icon.svg

      - name: Build Tauri app (Windows .msi / .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .

      - name: Upload Windows installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: giulia-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error